[project]
name = "gitail"
version = "0.1.0"
description = "Git-backed element-state history for architectural detail drawings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ezdxf>=1.3",
  "click>=8.0",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
  "pdfminer.six>=20221112",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
gitail = "gitail.cli:main"
arcdiff = "gitail.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["gitail*"]

[tool.setuptools.package-data]
gitail = ["config/*.yaml", "taxonomy_seed/*.yaml", "taxonomy_seed/nodes/*.yaml", "taxonomy_seed/nodes/values/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
