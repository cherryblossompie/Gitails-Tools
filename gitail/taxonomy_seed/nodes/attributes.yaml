# Seed Level 3 — Attributes (brief 8.4 + addendum A.5). A shared vocabulary
# applied to any part, not defined per-part. Only attributes resolved by
# attribution attach to a drawing; unbound attributes produce no leaf.
# Measure attributes (setdown/fall): a thickness search must never return a
# setdown, and a 50mm setdown beside a 200mm slab records both distinctly.
