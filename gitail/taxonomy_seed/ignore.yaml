# Strings that are never taxonomy nodes (brief 8.7.4 action D). Matching is
# normalised (case-folded, whitespace-collapsed); ignored strings stay
# full-text searchable — ignoring means "not a node", not "delete".
ignored:
- 'scale:'
- 'do not scale'
- 'nts'
- 'not to scale'
- 'typical'
- 'typ.'
- 'tbc'
- 'refer'
- 'refer.'
- 'north'
- 'true north'
- 'project north'
- 'rev '
- 'revision'
- 'cloud'
- 'walltype varies'
- 'all dimensions to be verified on site'
- 'do not scale drawing'
# Regex patterns (case-insensitive) for boilerplate that varies per sheet:
# scale strings, sheet numbers, revision markers, north arrows.
patterns:
- '^scale\b'
- '\bscale\s*1\s*:\s*\d+'
- '\bnorth\b'
- '^[a-z]{1,3}\.[0-9]{2,4}(/[0-9]{2,4})?$'
- '^rev\b|^r[0-9]{1,3}\b|\brevision\b'
- '^tbc$'
- '\bnts\b|not to scale|do not scale'
