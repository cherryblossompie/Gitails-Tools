# Materials map — user-editable. Drives semantics.py entirely.
# hatch pattern + keyword -> material. Extend without touching code.

materials:
  glass:
    keywords: [glass, glazing, laminated, toughened]
    qualifiers: [toughened, laminated, clear, low-e, lowe, obscure, tinted]
  plywood:
    keywords: [plywood, ply]
  steel:
    keywords: [steel, shs, rhs, ub, uc, pfc]
    profiles: [SHS, RHS, UB, UC, PFC, EA, UA]
  insulation:
    keywords: [insul, insulation, batt, batts, earthwool, Bradford, Pink]
  concrete:
    keywords: [concrete, conc]
  timber:
    keywords: [timber, hardwood, softwood, pine, stud, joist]
  plasterboard:
    keywords: [plasterboard, plaster, gwb, gyprock]
  aluminium:
    keywords: [aluminium, aluminum, alum, alu]
  tile:
    keywords: [tile, tiles]
  quirk:
    keywords: [quirk]

# Hatch pattern name (upper-case as stored in DXF) -> material.
# Covers common AutoCAD patterns; add firm-specific ones here.
hatch_map:
  ANSI31: steel
  ANSI32: steel
  ANSI33: steel
  ANSI37: steel
  AR-CONC: concrete
  AR-SAND: concrete
  AR-HBONE: concrete
  EARTH: earth
  GRASS: earth
  SOLID: solid

# Component nouns — the "part" facet. "INTERNAL TIMBER LINING" parses to
# material=timber, part=lining, so both searches find it. Longest match wins,
# plurals fold to singular, word boundaries prevent partial hits.
parts:
  - architrave
  - skirting
  - threshold
  - lining
  - decking
  - cladding
  - jamb
  - reveal
  - membrane
  - flashing
  - gutter
  - grate
  - insulation
  - plasterboard
  - door
  - entry
  - window
  - wall
  - floor
  - slab
  - tile
  - board
  - mat
  - outlet
  - drain

# Known qualifiers searched case-insensitively in annotation strings.
qualifiers:
  - toughened
  - laminated
  - clear
  - low-e
  - lowe
  - obscure
  - tinted
  - fire-rated
  - acoustic
  - nominal
  - tbc
  - varies
  - min
  - max
  - typical
  - indeterminate
